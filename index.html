<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Map Builder</title> //The name of the tab on chrome is "Map Builder"
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Map Builder</h1>

  <div id="toolbar">
    <button data-tile="empty">Empty (1)</button>
    <button data-tile="road">Road (2)</button>
    <button data-tile="building">Building (3)</button>
    <button data-tile="park">Park (4)</button>
    <button id="set-start-btn">Set Start</button>
    <button id="set-end-btn">Set End</button>
    <button id="find-path-btn">Find Path</button>
    <button id="save-btn">Save</button>
    <button id="load-btn">Load</button>
    <button id="clear-btn">Clear</button>
  </div>

  <canvas id="map" width="640" height="480"></canvas>

  <script src="script.js"></script>
</body>
</html>
